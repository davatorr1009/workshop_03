# Worlds available in workshop 03.
#   ros2 launch omni_workshop simulation.launch.py world:=<key>
#
# Each world is worlds/worlds/<key>.sdf (worlds package) and its pieces are in worlds/models/.
#
# gz_world:    name of the <world> inside the SDF (Gazebo uses it in its topics and services)
# start:       initial pose of the Dingo-O [x, y, yaw] in meters and radians, chosen as a
#              free cell with 0.5 m of clearance around the robot.
arena:
  description: 6 x 6 m arena with walls, for testing trajectories
  gz_world: arena
  start: [0.0, -1.5, 0.0]         # centered in x, 1.5 m below the center
coral:
  description: CoRAL laboratory (floor plan PL-002), with the drone cage
  gz_world: coral
  start: [-4.875, -0.3, 0.0]      # bottom center of the cage
house:
  description: Single-story house, 17 x 9 m, 19 rooms
  gz_world: house_world
  start: [15.07, 4.57, 0.0]       # anteroom; the small rooms do not fit the Dingo-O
office_0:
  description: Small office with 5 private offices, 11 x 9.75 m
  gz_world: office_0_world
  start: [2.07, 3.12, 0.0]
office_1:
  description: Open floor plan with perimeter rooms, 19.3 x 10.65 m
  gz_world: office_1_world
  start: [6.17, 1.98, 0.0]        # kitchen, next to the main entrance
office_2:
  description: Long floor plan with private offices and a courtyard, 13.5 x 22.8 m
  gz_world: office_2_world
  start: [6.77, 20.33, 0.0]       # lounge, north entrance
office_3:
  description: Beauty salon with curved walls, 14.4 x 18 m
  gz_world: office_3_world
  start: [5.82, 1.38, 0.0]        # entrance on the south facade
office_4:
  description: Orthodontic clinic with curved walls, 32 x 18.15 m
  gz_world: office_4_world
  start: [3.22, 11.73, 0.0]       # reception
