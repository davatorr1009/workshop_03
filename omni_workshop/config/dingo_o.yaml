# Workshop robot: Clearpath Dingo-O (do100) with two Hokuyo lidars.
# It is the same for everyone. On launch, Clearpath generates the URDF, controllers
# and launch files from this file in ~/.ros/omni_workshop/clearpath/.
serial_number: do100-0000
version: 0
system:
  hosts:
    - hostname: cpr-do100-0000
      ip: 192.168.131.1
  ros2:
    namespace: do100_0000
platform:
  mcu:
    protocol: proton
  extras:
    ros_parameters:
      platform_velocity_controller:
        # mecanum_drive_controller 4.42.1 (Jazzy) has a bug: when the command expires
        # (reference_timeout) it only zeroes the front-left wheel and the other three
        # keep their last velocity. With 0.1 s (Clearpath's value) it expires before the
        # braking ramp ends and the robot keeps moving. With 1.0 s the ramp (0.5 s at
        # most) finishes first. Fixed in 4.43.0.
        reference_timeout: 1.0
mounts:
  bracket:
    - parent: front_2_mount
    - parent: rear_2_mount
      rpy: [0.0, 0.0, 3.1415]
sensors:
  lidar2d:
    - model: hokuyo_ust
      parent: bracket_0_mount
    - model: hokuyo_ust
      parent: bracket_1_mount
